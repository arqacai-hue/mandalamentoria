<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico L.O.J.A. 360º</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: acolhedor e simples, como uma conversa com a arquiteta — uma pergunta por vez
   IDEA: uma ficha de avaliação da loja que, no fim, vira uma mandala
   PICTURE: a mandala de 8 pétalas, uma por área da loja, colorida pelo estado
   COLOUR and TYPE: roxo Arqaçaí #4a1f5c dominante, lilás de apoio, semáforo só no resultado; Poppins + Nunito Sans
   LAYOUT: coluna única calma, cartões grandes para tocar, barra de progresso fixa */
:root{color-scheme:light dark;
--roxo:#4a1f5c;--roxo2:light-dark(#6b3a80,#c9a6d8);--lil:light-dark(#f4edf7,#2a1c31);--lil2:light-dark(#e4d6ea,#3e2a48);
--bg:light-dark(#fbf8fc,#150e18);--card:light-dark(#fff,#1f1524);--ink:light-dark(#2a2230,#efe7f2);--mut:light-dark(#76687c,#b3a5b9);
--crit:#d64545;--aten:#e8a317;--bom:#2f9e5b;--critT:light-dark(#f6d2d2,#4a2024);--atenT:light-dark(#fae6b8,#463614);--bomT:light-dark(#cfeedb,#173a25)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Nunito Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Poppins,system-ui,sans-serif;line-height:1.12;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(30px,6vw,46px)}h2{font-size:clamp(22px,4.4vw,30px)}h3{font-size:18px}
header.top{background:var(--roxo);color:#fff;padding:14px max(5vw,16px);display:flex;align-items:center;gap:14px}
header.top img{height:46px}header.top b{font-family:Poppins;font-size:15px;font-weight:600}header.top span{display:block;font-size:13px;opacity:.85}
.wrap{max-width:720px;margin:0 auto;padding:24px max(5vw,16px) 120px}
.prog{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px max(5vw,16px);border-bottom:1px solid var(--lil2)}
.prog .bar{height:8px;background:var(--lil2);border-radius:9px;overflow:hidden}.prog .bar i{display:block;height:100%;background:var(--roxo2);transition:width .3s}
.prog small{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-top:5px}
.area{display:inline-block;background:var(--lil);color:var(--roxo2);font-weight:700;font-size:14px;padding:4px 12px;border-radius:20px;margin-bottom:12px}
.dica{background:var(--lil);border-radius:12px;padding:10px 14px;color:var(--mut);font-size:15px;margin:6px 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:58px;padding:14px 16px;border:2px solid var(--lil2);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--roxo2)}.opt:focus-visible{outline:3px solid var(--roxo2);outline-offset:2px}
.opt.on{border-color:var(--roxo2);background:var(--lil)}
.opt .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--roxo2)}.opt.on .dot{background:var(--roxo2);box-shadow:inset 0 0 0 4px var(--card)}
.opt.sec{min-height:48px;border-style:dashed;color:var(--mut);font-size:15px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--lil2);padding:12px max(5vw,16px);display:flex;gap:10px;justify-content:center;z-index:6}
.nav .in{max-width:720px;width:100%;display:flex;gap:10px}
.btn{min-height:50px;padding:0 22px;border-radius:12px;border:0;font:700 16px "Nunito Sans",sans-serif;cursor:pointer;background:var(--roxo);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn.gh{background:transparent;color:var(--roxo2);border:2px solid var(--lil2)}.btn.full{flex:1}
.btn:focus-visible{outline:3px solid var(--roxo2);outline-offset:2px}
label.f{display:block;font-weight:700;margin:16px 0 6px}
input[type=text],input[type=tel],textarea,select{width:100%;font:16px "Nunito Sans",sans-serif;padding:13px 14px;border:2px solid var(--lil2);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--roxo2)}
textarea{min-height:110px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips .opt{width:auto;min-height:46px;padding:8px 14px}
.intro li{margin:6px 0}.lead{font-size:18px;color:var(--mut)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.foto{border:2px dashed var(--lil2);border-radius:12px;padding:10px;text-align:center;font-size:14px;cursor:pointer;background:var(--card);min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.foto img{width:100%;height:90px;object-fit:cover;border-radius:8px}.foto input{display:none}
.fig{position:relative;width:100%;max-width:560px;aspect-ratio:1;margin:8px auto}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;font-size:15px;margin:6px 0 22px}.leg i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.cards{display:grid;gap:12px}
.ac{background:var(--card);border-radius:14px;padding:14px 16px;border:1px solid var(--lil2);border-left:6px solid var(--c)}
.ac .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.ac .n{font:700 22px Poppins;color:var(--c);white-space:nowrap}
.ac p{margin:4px 0 0;font-size:15px;color:var(--mut)}.ac .tag{font-size:13px;font-weight:700;color:var(--c)}
.prio{background:var(--roxo);color:#fff;border-radius:16px;padding:18px 20px;margin:22px 0}.prio ol{margin:8px 0 0;padding-left:22px}.prio li{margin:6px 0}
.resp{font-size:15px}.resp div{padding:8px 0;border-bottom:1px solid var(--lil2)}.resp b{display:block}
.acts{display:grid;gap:10px;margin-top:22px}.acts .btn{width:100%}
.msg{font-size:14px;color:var(--mut);text-align:center;min-height:20px}
.envio{background:var(--card);border:2px solid var(--lil2);border-radius:16px;padding:18px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.seg .opt{min-height:50px;padding:8px 10px;font-size:15px;justify-content:center}
@media(max-width:420px){.seg{grid-template-columns:1fr}.seg .opt{justify-content:flex-start}}
.passos ol{margin:14px 0 0;padding-left:24px}.passos li{margin:10px 0;padding-left:4px}
.ajuda{margin-top:16px;background:var(--lil);border-radius:12px;padding:12px 14px;font-size:15px}
.hide{display:none!important}
@media print{.prog,.nav,.acts,.noprint,header.top{display:none!important}body{background:#fff;color:#2a2230}.wrap{padding:0}.ac,.prio{break-inside:avoid}details{display:block}details>*{display:block}.resp{font-size:11pt}.printhead{display:flex!important}}
.printhead{display:none;background:#4a1f5c;color:#fff;border-radius:10px;padding:12px 18px;align-items:center;gap:16px;margin-bottom:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.printhead img{height:50px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 if(st===0)return intro();

function notas(){
 return AREAS.map(a=>{const qs=Q.filter(q=>q.a===a.id);let s=0,n=0,ns=0;
  qs.forEach(q=>{const k=S.r[q.i];if(k===undefined)return;const v=q.o[k][1];if(v===null)return;if(v==="ns"){ns++;s+=30;n++}else{s+=v;n++}});
  const nota=n?Math.round(s/n):null;const st=nota===null?"na":nota>=75?"bom":nota>=50?"aten":"crit";return{...a,nota,st,ns}});
}
const ST={crit:["Crítico","--crit","Precisa de ação logo: é aqui que a loja mais perde vendas ou conforto."],aten:["Precisa de atenção","--aten","Funciona, mas tem ajustes que fazem diferença."],bom:["Bom","--bom","Está no caminho certo. Vamos só manter e refinar."],na:["Sem dados","--mut","Não se aplica à sua loja."]};
const probe=document.createElement("i");probe.style.display="none";document.body.appendChild(probe);
const col=v=>{probe.style.color=`var(${v})`;return getComputedStyle(probe).color||"#888"};
function mandala(svg,N){
 const W=svg.clientWidth||480,c=W/2,R=W*0.30,r0=W*0.085,lab=W*0.345,n=N.length,fs=W<420?10.5:13;
 const pt=(r,a)=>[c+r*Math.cos(a),c+r*Math.sin(a)];
 const arc=(r1,r2,a1,a2)=>{const[x1,y1]=pt(r2,a1),[x2,y2]=pt(r2,a2),[x3,y3]=pt(r1,a2),[x4,y4]=pt(r1,a1);return`M${x1} ${y1}A${r2} ${r2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 0 0 ${x4} ${y4}Z`};
 const rr=v=>r0+(R-r0)*v/100;let h="";
 [[100,"--bomT"],[75,"--atenT"],[50,"--critT"]].forEach(z=>h+=`<circle cx="${c}" cy="${c}" r="${rr(z[0])}" fill="${col(z[1])}"/>`);
 N.forEach((a,i)=>{const a1=-Math.PI/2+i*2*Math.PI/n+0.025,a2=a1+2*Math.PI/n-0.05;
  if(a.nota!==null)h+=`<path d="${arc(r0,rr(Math.max(a.nota,6)),a1,a2)}" fill="${col(ST[a.st][1])}" stroke="${col("--card")}" stroke-width="2"/>`;
  const am=(a1+a2)/2,[lx,ly]=pt(lab,am),anc=Math.abs(Math.cos(am))<0.3?"middle":Math.cos(am)>0?"start":"end";
  const words=a.nome.split(" "),lines=[];let l="";words.forEach(w=>{if((l+" "+w).trim().length>(W<420?11:14)){lines.push(l.trim());l=w}else l+=" "+w});lines.push(l.trim());
  const y0=ly-(lines.length-1)*fs*0.6;
  h+=`<text x="${lx}" y="${y0}" text-anchor="${anc}" font-size="${fs}" font-family="Nunito Sans,Arial,sans-serif" font-weight="700" fill="${col("--ink")}">${lines.map((t,j)=>`<tspan x="${lx}" dy="${j?fs*1.15:0}">${esc(t)}</tspan>`).join("")}<tspan x="${lx}" dy="${fs*1.25}" fill="${col(ST[a.st][1])}">${a.nota===null?"—":a.nota+"%"}</tspan></text>`;});
 [50,75,100].forEach(v=>h+=`<circle cx="${c}" cy="${c}" r="${rr(v)}" fill="none" stroke="${col("--card")}" stroke-width="1.5" stroke-dasharray="3 4"/>`);
 const val=N.filter(a=>a.nota!==null),g=val.length?Math.round(val.reduce((s,a)=>s+a.nota,0)/val.length):0;
 h+=`<circle cx="${c}" cy="${c}" r="${r0-3}" fill="#4a1f5c"/><text x="${c}" y="${c+fs*0.2}" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-weight="700" font-size="${fs*1.7}" fill="#fff">${g}%</text><text x="${c}" y="${c+fs*1.4}" text-anchor="middle" font-size="${fs*0.8}" fill="#fff">geral</text>`;
 svg.setAttribute("viewBox",`0 0 ${W} ${W}`);svg.innerHTML=h;
}

   <div class="ajuda"><b>Não conseguiu?</b> Sem problema: tire prints (fotos da tela) da sua mandala e das prioridades e mande no grupo da mentoria. A gente te ajuda por lá.</div>
  </div>
 </div>
 <details style="margin-top:26px" open><summary style="font-weight:700;cursor:pointer">Todas as respostas</summary>
 <div class="resp"><div><b>Perfil</b>${esc([p.tipo,p.modelo,p.situacao,p.tam,p.func&&p.func+" funcionário(s) por turno",p.prod.join(", "),p.wpp].filter(Boolean).join(" · "))}</div>
 ${AREAS.map(a=>`<div><b style="color:var(--roxo2)">${a.nome}</b></div>`+Q.filter(q=>q.a===a.id).map(q=>`<div><b>${esc(q.q)}</b>${S.r[q.i]===undefined?"—":esc(q.o[S.r[q.i]][0])}</div>`).join("")).join("")}
 <div><b>Maior problema hoje</b>${esc(S.ab.prob)||"—"}</div><div><b>O que quer resolver na mentoria</b>${esc(S.ab.quer)||"—"}</div></div></details>
 ${Object.keys(fotos).length?`<h2 style="margin-top:26px">Fotos da loja</h2><div class="fotos">${Object.keys(fotos).map(i=>`<figure style="margin:0"><img src="${fotos[i]}" style="width:100%;border-radius:10px" alt="${FOTOS[i]}"><figcaption style="font-size:13px">${FOTOS[i]}</figcaption></figure>`).join("")}</div>`:""}`;
 const svg=document.getElementById("mand");const ro=new ResizeObserver(()=>mandala(svg,N));ro.observe(svg);
 try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>mandala(svg,N))}catch(e){}
 const mo=new MutationObserver(()=>mandala(svg,N));mo.observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
 const msg=t=>document.getElementById("msg").textContent=t;
 document.getElementById("pdf").onclick=()=>{try{window.print();msg("Escolha \"Salvar como PDF\" e depois envie o arquivo no grupo da mentoria.")}catch(e){msg("O PDF não abriu neste aparelho. Veja abaixo o que fazer.")}};
}
bN.onclick=()=>{if(bN.disabled)return;S.step++;render()};
bB.onclick=()=>{S.step=Math.max(0,S.step-1);render()};
render();
}
</script>
</body>
